<style>
/* Layout: 入場畫面 → 左側即時街景預覽／右側建造步驟（手機上下堆疊）→ 開幕典禮結算 */
:root{
  --bg:#eef2ea; --panel:#fffdf7; --ink:#25292b; --muted:#646b68; --line:#d9dccf;
  --accent:#d0553a; --accent-ink:#fff; --coin:#c58b0e; --good:#2d7d4f; --bad:#b4372b;
  --sky1:#bfe3f5; --sky2:#e9f6fb; --win:#ffe9a8; --sun:#ffd25a;
  --f-hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a1c; --panel:#20262a; --ink:#e9ece6; --muted:#9ea7a3; --line:#343c40;
  --accent:#f08a6c; --accent-ink:#1b1210; --coin:#f0c04a; --good:#6fd39a; --bad:#ff8a7a;
  --sky1:#1b2a4a; --sky2:#33476e; --win:#ffd36b; --sun:#f3efd8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a1c; --panel:#20262a; --ink:#e9ece6; --muted:#9ea7a3; --line:#343c40;
  --accent:#f08a6c; --accent-ink:#1b1210; --coin:#f0c04a; --good:#6fd39a; --bad:#ff8a7a;
  --sky1:#1b2a4a; --sky2:#33476e; --win:#ffd36b; --sun:#f3efd8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 18px;border-radius:12px;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{font-size:18px;padding:14px 28px;border-radius:14px;font-family:var(--f-hand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scene{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 14px 30px -18px rgba(0,0,0,.5)}
/* intro */
.intro{display:grid;gap:22px;justify-items:center;text-align:center;padding-top:10px}
.intro h1{font-family:var(--f-hand);font-weight:700;font-size:clamp(38px,8vw,72px);line-height:1.05;margin:0;letter-spacing:.06em}
.intro .sub{color:var(--muted);max-width:34em;margin:0}
.intro .scene{max-width:820px}
.intro .row{justify-content:center}
.others{width:100%;max-width:820px;text-align:left}
.others h2{font-family:var(--f-hand);font-size:20px;margin:0 0 8px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ocard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.ocard b{font-family:var(--f-hand);font-size:17px}
.ocard span{font-size:12.5px;color:var(--muted)}
/* builder */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar h1{font-family:var(--f-hand);font-size:24px;margin:0}
.coins{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#d99a12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:0 0 22px}
.meter{width:150px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--coin);transition:width .3s}
.coins.over{color:var(--bad)}.coins.over .meter i{background:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps button b{font-family:var(--f-mono);font-weight:500}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button.done{color:var(--ink)}
.build{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.build{grid-template-columns:1fr}}
.preview{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:10px}
@media (max-width:860px){.preview{position:static}}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{display:block;color:var(--ink);font-size:17px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h2{font-family:var(--f-hand);font-size:26px;margin:0;line-height:1.2}
.panel .lead{margin:-6px 0 0;color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;text-align:left;display:grid;gap:4px;min-width:0;position:relative}
.opt svg{width:100%;height:auto;border-radius:8px;display:block}
.opt b{font-size:15px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.4}
.opt .price{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11.5px;background:var(--panel);border-radius:99px;padding:1px 7px;display:flex;align-items:center;gap:4px}
.opt .price::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coin)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.opt .fit{font-size:11.5px;color:var(--good);font-weight:700}
.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.field input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:17px;color:var(--ink);font-family:var(--f-hand);width:100%}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;line-height:1}
.stepper output{font-family:var(--f-hand);font-size:34px;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
.stepper span{color:var(--muted);font-size:13px}
.note{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--bg);border-left:3px solid var(--coin)}
.note.bad{border-left-color:var(--bad);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* opening */
.open{display:grid;gap:18px}
.ribbon{text-align:center;display:grid;gap:4px}
.ribbon small{letter-spacing:.3em;color:var(--accent);font-weight:700}
.ribbon h1{font-family:var(--f-hand);font-size:clamp(32px,6vw,52px);margin:0;line-height:1.1}
.stars{font-size:28px;letter-spacing:4px;color:var(--coin)}
.stars i{font-style:normal;color:var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-hand);font-size:20px;margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;min-width:0}
.tips{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
@keyframes rise{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.pop{animation:rise .35s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.stage3d{position:relative;width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--sky1);box-shadow:0 14px 30px -18px rgba(0,0,0,.5);touch-action:none}
.stage3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage3d canvas:active{cursor:grabbing}
.stage3d .scene{border-radius:0;box-shadow:none;height:100%}
.viewbar{position:absolute;left:10px;top:10px;display:flex;gap:4px;background:rgba(255,255,255,.85);border-radius:10px;padding:3px}
.viewbar button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:13px;color:#25292b}
.viewbar button[aria-pressed="true"]{background:#25292b;color:#fff}
.hint3d{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:#25292b;background:rgba(255,255,255,.75);padding:2px 8px;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));font-weight:700}
.chip .fit{font-size:11px;color:var(--good)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px;color:var(--ink)}
.spec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.spec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spec-h b{font-family:var(--f-hand);font-size:18px;display:flex;gap:6px;align-items:center}
.spec-h b i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.spec-h .sp{flex:1}
.sugg{display:grid;gap:4px}
.sugg label{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start;font-size:14px;padding:6px 8px;border-radius:8px;background:var(--panel)}
.sugg label small{grid-column:2;color:var(--muted);font-size:12.5px}
.sugg a{color:var(--accent);font-size:12px}
.mini{font-size:12.5px;padding:5px 10px;border-radius:8px}
.books{display:grid;gap:6px;max-height:460px;overflow-y:auto;padding-right:2px}
.bk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--c)}
.bk .t{min-width:0}
.bk .t b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.bk .t small{color:var(--muted);font-size:12px}
.bk input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}
.bk .done{font-size:12px;color:var(--good);font-weight:700;white-space:nowrap}
.bk .x{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 6px}
.earn{font-family:var(--f-mono);font-size:12.5px}
.coinline{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.expand{display:grid;gap:12px}
.exrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exrow .lbl{flex:1;min-width:120px}
.exrow .lbl b{font-family:var(--f-hand);font-size:22px}
.flt{display:flex;gap:6px;flex-wrap:wrap}

.card{align-content:start}
.open .stage3d{aspect-ratio:16/8}
@media (max-width:640px){.open .stage3d{aspect-ratio:4/3}}

.lot{display:grid;gap:6px;justify-items:center;background:var(--panel);border:2px dashed var(--accent);border-radius:16px;padding:16px 22px;max-width:640px;width:100%}
.lot span{color:var(--muted);font-size:13px;letter-spacing:.1em}
.lot b{font-family:var(--f-hand);font-size:clamp(26px,5vw,36px);line-height:1.2}
.lot small{color:var(--muted);font-size:13.5px}
.reader{display:flex;gap:14px;align-items:flex-start}
.face{flex:0 0 56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#f2c9a0 0 34%,transparent 35%),var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.bubble{position:relative;background:var(--bg);border-radius:14px;padding:12px 14px;font-family:var(--f-hand);font-size:20px;line-height:1.4;min-width:0;display:grid;gap:4px}
.bubble small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--good)}
.answers{display:grid;gap:8px}
.answers .btn{justify-content:flex-start;text-align:left;font-size:15px}
.answers .btn.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel));opacity:1}
.answers .btn.dim{opacity:.4}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.zsel{margin-top:4px;max-width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:3px 6px;font-size:12.5px}
#quickBook .zsel{margin:0;font-size:14px}
.bk .t a{color:var(--accent)}
#resetWrap{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}

.catcard{position:relative;background:#fffbea;color:#2b2610;border:1px solid #e4d9b0;border-radius:6px;padding:16px 18px 14px 18px;display:grid;gap:4px;box-shadow:0 6px 14px -8px rgba(0,0,0,.3);background-image:repeating-linear-gradient(transparent 0 27px,#c9dcef 27px 28px);background-position:0 18px}
.catcard::before{content:"";position:absolute;left:0;right:0;top:44px;height:1px;background:#e58c8c}
.catcard b{font-family:var(--f-hand);font-size:22px;line-height:1.3;padding-right:20px}
.catcard span{font-size:13.5px;color:#5c5530}
.catcard p{margin:6px 0 0;font-size:14.5px;line-height:1.9}
.catcard a{font-size:12.5px;color:#2f56c4;justify-self:start}
.catcard .hole{position:absolute;bottom:10px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--panel);border:1px solid #e4d9b0}
.loadbar{width:40%!important;animation:load 1.2s ease-in-out infinite alternate}
@keyframes load{from{margin-left:0}to{margin-left:60%}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const tree=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-5" y="-10" width="10" height="34" fill="#7a5230"/><circle cx="0" cy="-30" r="26" fill="#4f9a52"/><circle cx="-16" cy="-18" r="16" fill="#5fae5c"/><circle cx="16" cy="-20" r="17" fill="#468a48"/></g>`;
const cloud=(x,y)=>`<g fill="#fff" opacity=".85"><ellipse cx="${x}" cy="${y}" rx="34" ry="12"/><ellipse cx="${x+18}" cy="${y-8}" rx="20" ry="12"/><ellipse cx="${x-16}" cy="${y-5}" rx="16" ry="10"/></g>`;
function background(loc){
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
  <rect width="800" height="420" fill="url(#sky)"/><circle cx="690" cy="70" r="30" style="fill:var(--sun)"/>${cloud(140,80)}${cloud(470,55)}`;
  if(loc==="park"){
    s+=`<rect y="400" width="800" height="100" fill="#7cbf5a"/><path d="M330 500 Q400 440 470 400 L520 400 Q450 450 430 500Z" fill="#e3d3a8"/>
    <ellipse cx="690" cy="455" rx="80" ry="22" fill="#6fb3d6"/><ellipse cx="670" cy="450" rx="22" ry="4" fill="#fff" opacity=".5"/>
    ${tree(70,402,1.2)}${tree(160,404,.9)}${tree(640,404,1.1)}${tree(740,402,1.25)}
    <g transform="translate(110 455)"><rect x="0" y="0" width="60" height="6" fill="#8a5a33"/><rect x="0" y="-12" width="60" height="5" fill="#8a5a33"/><rect x="4" y="6" width="4" height="12" fill="#555"/><rect x="52" y="6" width="4" height="12" fill="#555"/></g>`;
  }else if(loc==="school"){
    s+=`<rect y="400" width="800" height="100" fill="#c9b99a"/><ellipse cx="160" cy="470" rx="150" ry="24" fill="none" stroke="#c4553d" stroke-width="10"/>
    <g><rect x="10" y="250" width="210" height="150" fill="#f1e3c6"/><rect x="10" y="240" width="210" height="14" fill="#c4553d"/>
    ${[0,1,2].map(r=>[0,1,2,3,4].map(c=>`<rect x="${24+c*40}" y="${266+r*42}" width="24" height="24" fill="#9cc8dc"/>`).join("")).join("")}
    <circle cx="115" cy="226" r="14" fill="#fff" stroke="#444" stroke-width="3"/><path d="M115 226V216M115 226h7" stroke="#444" stroke-width="2"/></g>
    <rect x="700" y="230" width="5" height="172" fill="#888"/><path d="M705 236h44v28h-44z" fill="#d84a3a"/>
    ${tree(620,404,.9)}${tree(770,404,1)}`;
  }else{
    s+=`<rect y="400" width="800" height="100" fill="#bdb3a5"/>
    <path d="M0 40 Q200 80 400 40 T800 40" fill="none" stroke="#7a5a3a" stroke-width="2"/>
    ${[60,150,250,550,650,740].map((x,i)=>`<g transform="translate(${x} ${52+((i%3)*6)})"><line x1="0" y1="-14" x2="0" y2="-4" stroke="#7a5a3a"/><ellipse cx="0" cy="8" rx="11" ry="13" fill="#d8392f"/><rect x="-6" y="-6" width="12" height="4" fill="#e7b545"/></g>`).join("")}
    ${stall(20,"#d8392f")}${stall(140,"#2f7ac4")}${stall(580,"#3c9a4f")}${stall(700,"#e09a22")}`;
  }
  return s;
}
function stall(x,c){

function evaluate(x){
  const fits=FIT[x.loc].includes(x.theme.key)?1:0;
  const visitors=Math.round(LOCS[x.loc].base*(1+0.18*fits)*(x.facade==="glass"?1.08:1)*(x.counter==="stack"||x.counter==="tree"?1.06:1)*(1+Math.min(.5,shelved(x)*.01)));
  const capacity=x.floors*130;
  const perStaff=COUNTERS[x.counter].selfService?110:75;
  const service=Math.min(1,x.staff*perStaff/visitors), room=Math.min(1,capacity/visitors);
  const variety=Math.min(1,x.specs.length/3), shelf=Math.min(1,shelved(x)/15);
  const score=0.35*service+0.2*room+0.15*fits+0.1*variety+0.2*shelf;
  const stars=Math.max(1,Math.min(5,Math.round(score*5)));
  const tips=[];
  if(service<0.8)tips.push("櫃檯前開始排隊了，館員有點忙不過來。");
  if(room<1)tips.push(`座位只夠 ${capacity} 人，尖峰時段會客滿。`);
  if(!fits)tips.push(`在${LOCS[x.loc].name}，「${FIT[x.loc].map(s=>PRESETS[s][0]).join("、")}」這類特色特別受歡迎。`);
  if(!x.specs.length)tips.push("在館藏特色裡開幾個專屬書區，例如翻譯文學、漫畫區。");
  const toRead=x.books.filter(b=>!b.read).length, ready=x.books.filter(b=>b.read&&!b.shelved).length;
  if(ready)tips.push(`有 ${ready} 本已讀完的書等著上架，每本可賺 ${SHELF_REWARD} 金幣。`);
  else if(toRead)tips.push(`館藏裡還有 ${toRead} 本書沒讀，讀完打勾就能上架賺金幣。`);
  else if(!x.books.length)tips.push("先在書區裡請 AI 推薦書單列入館藏，讀完就能上架。");
  if(!tips.length)tips.push("配置很平衡，讀者會很喜歡這裡！");
  return{visitors,capacity,stars,fits,tips};
}

    const items=(Array.isArray(res)?res:[]).filter(x=>x&&x.title).slice(0,10).map(x=>({title:String(x.title).trim(),author:String(x.author||"").trim(),why:String(x.why||"").trim(),pick:!have.has(String(x.title).trim()),have:have.has(String(x.title).trim())}));
    sugg[key]=items.length?{state:"ok",items}:{state:"err",msg:"這次沒有拿到書單，換個說法描述特色再試一次。"};
  }catch(e){
    sugg[key]={state:"err",msg:e?.code==="not_granted"?"你沒有允許這個頁面使用 AI，所以無法產生書單。":e?.code==="rate_limited"?"請求太頻繁，稍等一分鐘再試。":"書單產生失敗，再試一次。"};
  }
  render();
}

async function suggestZones(){

  try{

/* ===== 上班：書目整理與選書 ===== */
const SHIFT_PAY=30, STREAK=10, BATCH=8;
let shift=null;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const zonesAll=()=>L.specs.length?L.specs:[L.theme];
async function startShift(){
  shift={i:0,earned:0,streak:0,right:0,added:0,items:[],fb:null,loading:true,src:""};
  screen="shift";view3d="in";render();scrollTo(0,0);
  const zones=zonesAll();
  let items=[];
  if(sample){
    try{
      const have=L.books.map(b=>b.title).slice(0,80).join("、");
      const res=await sample.json(`你是臺灣公共圖書館的採購館員，要準備一車「待選新書」給同事練習選書與分類。
這座圖書館的館藏特色是「${L.theme.name}」，書區有：${zones.map(z=>"「"+z.name+"」").join("、")}。
請列出 ${BATCH} 本真實存在、臺灣買得到的書（以繁體中文版為主），其中約 ${BATCH-3} 本明確屬於上面某一個書區，約 3 本不符合館藏特色、不應列入。
不要列這些已有的書：${have||"（無）"}。
每本的 zone 填它所屬的書區名稱（必須和上面的書區名稱一字不差），不該列入的填 null。
desc 寫 30 字內的中性書目簡介（不要提到書區名稱或是否該列入）；why 寫 25 字內說明為什麼放這區或為什麼不列入。
只列你確定存在的書，書名與作者要正確。只回覆 JSON 陣列，例如：[{"title":"書名","author":"作者","year":2015,"desc":"…","zone":"翻譯文學","why":"…"}]`,{modelTier:"default"});
      const names=new Set(zones.map(z=>z.name));
      items=(Array.isArray(res)?res:[]).filter(x=>x&&x.title&&(x.zone===null||names.has(x.zone))).slice(0,BATCH).map(x=>({title:String(x.title),author:String(x.author||""),year:x.year||"",desc:String(x.desc||""),zone:x.zone?zones.find(z=>z.name===x.zone).key:null,why:String(x.why||""),fresh:true}));
      shift.src="ai";
    }catch(e){shift.err=e?.code==="not_granted"?"你沒有允許這個頁面使用 AI，改用你館藏裡的書練習分類。":"新書目錄調不到，改用你館藏裡的書練習分類。"}
  }else shift.err="這個檢視無法使用 AI，改用你館藏裡的書練習分類。";
  if(items.length<3){
    const pool=shuffle(L.books.filter(b=>b.spec)).slice(0,BATCH);
    items=pool.map(b=>({title:b.title,author:b.author||"",year:"",desc:"館藏重新整理：確認這本書放在正確的書區。",zone:b.spec===L.theme.key&&L.specs.length?null:b.spec,why:`目前登記在「${specOf(b.spec)?.name||""}」。`,fresh:false,id:b.id}));
    shift.src="own";
  }
  if(!items.length){shift.loading=false;shift.empty=true;return render()}
  shift.items=items;shift.loading=false;render();
}
function answer(idx){
  if(!shift||shift.fb)return;
  const it=shift.items[shift.i];const zones=zonesAll();
  const choice=idx<0?null:zones[idx].key;
  const ok=choice===it.zone;
  let gain=0,added=false;
  if(ok){shift.streak++;gain=SHIFT_PAY+(shift.streak>1?STREAK*(shift.streak-1):0);shift.right++;
    if(it.fresh&&it.zone&&!L.books.some(b=>b.title===it.title)){L.books.push({id:uid(),title:it.title,author:it.author,spec:it.zone,read:false,shelved:false});added=true;shift.added++}}
  else shift.streak=0;
  shift.earned+=gain;
  const right=it.zone?`應該放「${specOf(it.zone)?.name}」`:"不該列入館藏";
  shift.fb={ok,gain,added,text:`${ok?"正確":"不太對，"+right}。${it.why}`};
  render();
}
function nextItem(){
  shift.i++;shift.fb=null;
  if(shift.i>=shift.items.length){L.wages=(L.wages||0)+shift.earned;L.shifts=(L.shifts||0)+1;persist();shift.done=true}
  render();
}

      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-work="1">再整理一車</button><button class="btn" data-go="open">回館長室</button></div></div></section>`;

  }
  const it=s.items[s.i],zones=zonesAll();
  const chosenRight=s.fb?it.zone:undefined;
  $("#app").innerHTML=`<div class="topbar"><h1>上班中・${esc(libName(L))}</h1><div class="coins"><span class="coin"></span><span>今天 +${s.earned}</span></div></div>
  <div class="build">
    <div class="preview">${stageHTML()}<p class="hint">${s.src==="ai"?"AI 調來的待選新書：判斷要放哪個書區，或不列入館藏。答對的新書會列入館藏。":"館藏重新整理：確認每本書在正確的書區。"}${s.err?" "+esc(s.err):""}</p></div>
    <section class="panel pop">
      <div class="row" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="hint">第 ${s.i+1} / ${s.items.length} 本</span><span class="hint">館藏特色：${esc(L.theme.name)}</span></div>
      <article class="catcard"><b>${esc(it.title)}</b><span>${esc(it.author)}${it.year?`・${esc(it.year)}`:""}</span><p>${esc(it.desc)}</p>
        <a href="https://search.books.com.tw/search/query/key/${encodeURIComponent(it.title)}/cat/all" target="_blank" rel="noopener">博客來書目 ↗</a></article>
      <div class="answers">${zones.map((z,i)=>`<button class="btn ${s.fb?(z.key===chosenRight?"right":"dim"):""}" data-ans="${i}" ${s.fb?"disabled":""} style="border-left:5px solid ${z.color}">放進「${esc(z.name)}」</button>`).join("")}
        <button class="btn ${s.fb?(chosenRight===null?"right":"dim"):""}" data-ans="-1" ${s.fb?"disabled":""}>不列入館藏</button></div>
      ${s.fb?`<p class="note ${s.fb.ok?"":"bad"}">${esc(s.fb.text)}${s.fb.ok?` +${s.fb.gain} 金幣${s.streak>1?`（連續 ${s.streak} 本）`:""}`:""}${s.fb.added?"・已列入館藏":""}</p>

    <div class="field">專屬書區<div class="chips">${ZONE_IDEAS.filter(z=>!L.specs.some(s=>s.name===z)).map(z=>`<button class="chip" data-zoneidea="${esc(z)}">＋ ${esc(z)}</button>`).join("")}
      <button class="chip" data-suggestzones="1" ${sgz?.state==="loading"?"disabled":""}>${sgz?.state==="loading"?"AI 思考中…":"AI 依特色建議書區"}</button></div></div>
    ${sgz?.state==="ok"?`<div class="chips">${sgz.items.filter(z=>!L.specs.some(s=>s.name===z)).map(z=>`<button class="chip" data-zoneidea="${esc(z)}" style="border-color:var(--accent)">＋ ${esc(z)}</button>`).join("")}</div>`:sgz?.state==="err"?`<p class="note bad">${esc(sgz.msg)}</p>`:""}
    <form class="addrow" id="customForm"><input id="customSpec" maxlength="12" placeholder="自己輸入書區名稱，例如：翻譯文學" aria-label="自訂書區"><button class="btn" type="submit">開書區</button></form>
    <div style="display:grid;gap:10px">${L.specs.map(specBlock).join("")||`<p class="hint">還沒有書區。開一個書區後，可以請 AI 推薦這區的書單。</p>`}</div>`;
  }
  if(k==="counter")body=`<h2>櫃檯長什麼樣子</h2><p class="lead">讀者走進門第一眼看到的地方。左邊已切到「館內」視角。</p>
    <div class="opts" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${Object.entries(COUNTERS).map(([id,v])=>`<button class="opt" data-counter="${id}" aria-pressed="${L.counter===id}"><span class="price">${v.price}</span>${counterSVG(id,L.staff,true)}<b>${v.name}</b><small>${v.desc}</small></button>`).join("")}</div>`;
  const last=step===STEPS.length-1;
  const nextLabel=L.opened?"完成裝修":"剪綵開幕";
  $("#app").innerHTML=`<div class="topbar"><h1>${esc(libName(L))}</h1>${coinsHTML(L)}</div>
  <nav class="steps" aria-label="建造步驟">${STEPS.map(([id,n],i)=>`<button data-step="${i}" ${i===step?'aria-current="step"':""} class="${i<step?"done":""}"><b>${i+1}</b>${n}</button>`).join("")}</nav>
  <div class="build">
    <div class="preview">${stageHTML()}
      <div class="stats"><span class="stat"><b>${ev.visitors}</b>每日讀者</span><span class="stat"><b>${ev.capacity}</b>座位容量</span><span class="stat"><b>${L.staff}</b>館員</span><span class="stat"><b>${L.books.length}</b>館藏</span><span class="stat"><b>${"★".repeat(ev.stars)}</b>預估評價</span></div>
    </div>
    <section class="panel pop" aria-live="polite">${body}
      ${w<0?`<p class="note bad">金幣不夠，還差 ${-w}。減少樓層、館員，或換便宜一點的選項${L.opened?"；也可以回館長室讀完書上架賺金幣":""}。</p>`:`<p class="note">${esc(ev.tips[0])}</p>`}
      <div class="nav"><button class="btn" data-nav="-1">${step?"上一步":(L.opened?"回館長室":"回入口")}</button>
      ${last?`<button class="btn primary big" data-nav="open" ${w<0?"disabled":""}>${nextLabel}</button>`:`<button class="btn primary" data-nav="1">下一步</button>`}</div>
    </section>
  </div>`;
  const nm=$("#libname");if(nm)nm.addEventListener("change",e=>{L.name=e.target.value;persist();render()});
}
function renderOpen(){
  const ev=evaluate(L),w=wallet(L);
  const list=L.books.filter(b=>bookFilter==="all"||(bookFilter==="toread"&&!b.read)||(bookFilter==="ready"&&b.read&&!b.shelved)||(bookFilter==="shelved"&&b.shelved));
  const cnt={toread:L.books.filter(b=>!b.read).length,ready:L.books.filter(b=>b.read&&!b.shelved).length,shelved:shelved(L)};
  $("#app").innerHTML=`<section class="open pop">
    <div class="ribbon"><small>${L.justOpened?"GRAND OPENING":"館長室"}</small><h1>${esc(libName(L))}${L.justOpened?" 開幕了":""}</h1>
      <div class="stars" aria-label="${ev.stars} 顆星">${"★".repeat(ev.stars)}<i>${"★".repeat(5-ev.stars)}</i></div></div>
    ${stageHTML()}
    <div class="two">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>館藏：讀完打勾才能上架</h3><span class="earn">每上架 1 本 +${SHELF_REWARD} 金幣</span></div>
        <div class="flt">${[["all",`全部 ${L.books.length}`],["toread",`待讀 ${cnt.toread}`],["ready",`可上架 ${cnt.ready}`],["shelved",`已上架 ${cnt.shelved}`]].map(([k,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${bookFilter===k}">${n}</button>`).join("")}</div>
        <div class="books">${list.map(b=>{const sp=specOf(b.spec);return `<div class="bk" style="--c:${sp?.color||"#999"}">
          <input type="checkbox" data-read="${b.id}" ${b.read?"checked":""} ${b.shelved?"disabled":""} aria-label="讀完《${esc(b.title)}》">
          <div class="t"><b>${esc(b.title)}</b><small>${esc(b.author||"")}${b.readAt?`・${esc(b.readAt)} 讀完`:""}・<a href="${tpml(b.title)}" target="_blank" rel="noopener" data-copy="${esc(b.title)}">北市圖館藏 ↗</a></small>
            <select class="zsel" data-zone="${b.id}" aria-label="《${esc(b.title)}》的書區">${zoneOpts(b.spec)}</select></div>
          ${b.shelved?`<span class="done">已上架</span>`:b.read?`<button class="btn primary mini" data-shelve="${b.id}">上架 +${SHELF_REWARD}</button>`:`<button class="x" data-rmbook="${b.id}" aria-label="從館藏移除">×</button>`}</div>`}).join("")||`<p class="hint">${L.books.length?"這個分類沒有書。":"館藏還是空的。到「特色與書區」請 AI 推薦書單，或在下面自己加一本。"}</p>`}</div>
        <form class="addrow" id="quickBook"><input id="qbTitle" maxlength="40" placeholder="自己加一本書的書名" aria-label="書名"><select id="qbZone" class="zsel" aria-label="放進哪個書區">${zoneOpts(L.specs[0]?.key||L.theme.key)}</select><button class="btn" type="submit">加入館藏</button></form>
        <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn mini" data-jump="3">新增書區或用 AI 書單擴充館藏</button></div>
      </div>
      <div class="card"><h3>擴建</h3>
        <div class="coinline"><span class="coin"></span><b>${w}</b> 金幣可用</div>
        <div class="expand">
          <div class="exrow"><div class="lbl"><b>${L.floors}</b> 層樓<div class="hint">加蓋一層 ${FLOOR_PRICE} 金幣・最多 ${MAX_FLOORS} 層</div></div><button class="btn primary" data-buy="floor" ${w<FLOOR_PRICE||L.floors>=MAX_FLOORS?"disabled":""}>＋ 加蓋一層</button></div>
          <div class="exrow"><div class="lbl"><b>${L.staff}</b> 位館員<div class="hint">聘請一位 ${STAFF_PRICE} 金幣・最多 ${MAX_STAFF} 位</div></div><button class="btn primary" data-buy="staff" ${w<STAFF_PRICE||L.staff>=MAX_STAFF?"disabled":""}>＋ 聘請館員</button></div>
        </div>
        <dl style="margin-top:6px"><dt>地點</dt><dd>${LOCS[L.loc].name}</dd><dt>外觀</dt><dd>${FACADES[L.facade].name}</dd><dt>櫃檯</dt><dd>${COUNTERS[L.counter].name}</dd>
        <dt>館藏特色</dt><dd>${esc(L.theme.name)}</dd><dt>專屬書區</dt><dd>${esc(L.specs.map(s=>s.name).join("、"))||"還沒有書區"}</dd><dt>每日讀者</dt><dd>約 ${ev.visitors} 人</dd><dt>上架賺得</dt><dd>${earned(L)} 金幣</dd><dt>上班賺得</dt><dd>${L.wages||0} 金幣・${L.shifts||0} 天</dd></dl>
        <h3>館長的下一步</h3><ul class="tips">${ev.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
        <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-work="1">上班：整理新書</button><button class="btn" data-go="build">重新裝修</button><button class="btn" data-go="intro">回入口</button><span id="resetWrap"><button class="btn" data-reset="ask">重新開始</button></span></div>
      </div>
    </div>
  </section>`;
}

/* ===== persistence ===== */
let saveT=null;
function persist(){try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){};clearTimeout(saveT);saveT=setTimeout(saveRemote,600)}
let saving=false;
async function saveRemote(){
  if(!db||!me.id)return;if(saving){saveT=setTimeout(saveRemote,500);return}
  saving=true;const body=JSON.parse(JSON.stringify(L));delete body.justOpened;body.updated=Date.now();
  try{await db.doc("libraries/"+me.id).set(body)}
  catch(e){if(e?.code==="invalid_argument"){db=null;toast("你的圖書館會存在這個瀏覽器裡（換電腦或清除瀏覽資料就會不見）。");return}toast(e?.code==="quota_exceeded"?"儲存空間已滿。":"暫時無法儲存到雲端，已存在這個瀏覽器。")}
  finally{saving=false}
}
let tT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3000)}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const ps=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:["#d0553a","#e3b341","#2f56c4","#2d7d4f","#c23f8f"][Math.floor(Math.random()*5)]}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<170)requestAnimationFrame(f);else c.hidden=true})();
}

/* ===== events ===== */
function addSpec(key,name,color){
  if(L.specs.length>=MAX_ZONES){toast(`最多 ${MAX_ZONES} 個書區，先移除一個`);return false}
  if(L.specs.some(s=>s.name===name)){toast("已經有這個書區了");return false}
  L.specs.push({key,name,color});return true;
}
document.addEventListener("click",async e=>{
  const a=e.target.closest("a[data-copy]");if(a){try{await navigator.clipboard.writeText(a.dataset.copy)}catch(_){}toast("已複製書名；若北市圖沒有直接帶出結果，貼上搜尋即可");return}
  const t=e.target.closest("button");if(!t||t.disabled)return;
  const d=t.dataset;let changed=true;
  if(d.reset==="ask"){$("#resetWrap").innerHTML=`<span class="hint">館藏、上架紀錄、金幣都會歸零，確定？</span> <button class="btn danger" data-reset="yes">確定重新開始</button> <button class="btn" data-reset="no">取消</button>`;return}
  if(d.reset==="no"){render();return}
  if(d.reset==="yes"){L=fresh();for(const k in sugg)delete sugg[k];shift=null;screen="intro";view3d="out";step=0;persist();render();scrollTo(0,0);toast("已重新開始，金幣回到 "+START);return}
  if(d.draw==="start"||d.draw==="again"){startDraw();return}
  if(d.draw==="accept"){L={...drawn,opened:true,justOpened:true};persist();screen="open";render();scrollTo(0,0);confetti();return}
  if(d.draw==="tweak"){L={...drawn};persist();screen="build";step=0;render();scrollTo(0,0);return}
  if(d.work){startShift();return}
  if(d.ans!==undefined){answer(+d.ans);return}
  if(d.nextitem){nextItem();return}
  if(d.quitshift){if(shift&&shift.earned&&!shift.done){L.wages=(L.wages||0)+shift.earned;L.shifts=(L.shifts||0)+1;persist()}shift=null;screen="open";view3d="out";render();return}
  if(d.view){view3d=d.view;render();return}
  if(d.go){clearInterval(shift?.timer);shift=null;screen=d.go;L.justOpened=false;if(d.go==="build"){step=0;view3d="out"}render();scrollTo(0,0);return}
  if(d.step!==undefined){step=+d.step;view3d=STEPS[step][0]==="counter"?"in":"out";render();return}
  if(d.jump){screen="build";step=+d.jump;view3d="out";render();scrollTo(0,0);return}
  if(d.filter){bookFilter=d.filter;render();return}
  if(d.nav){
    if(d.nav==="open"){const first=!L.opened;L.opened=true;L.justOpened=first;persist();screen="open";view3d="out";render();scrollTo(0,0);if(first)confetti();return}
    const n=step+(+d.nav);if(n<0){screen=L.opened?"open":"intro";render();return}step=Math.min(STEPS.length-1,n);view3d=STEPS[step][0]==="counter"?"in":"out";render();scrollTo({top:0,behavior:"smooth"});return}
  if(d.suggest){suggest(d.suggest);return}
  if(d.addpicked){const sg=sugg[d.addpicked];if(!sg?.items)return;let n=0;sg.items.forEach(it=>{if(it.pick&&!it.have){L.books.push({id:uid(),title:it.title,author:it.author,spec:d.addpicked,read:false,shelved:false});it.have=true;it.pick=false;n++}});
    persist();toast(n?`已列入館藏 ${n} 本，開幕後讀完就能上架`:"沒有勾選新的書");render();return}
  if(d.loc)L.loc=d.loc;
  else if(d.facade)L.facade=d.facade;
  else if(d.floors)L.floors=Math.max(1,Math.min(MAX_FLOORS,L.floors+ +d.floors));
  else if(d.staff)L.staff=Math.max(1,Math.min(MAX_STAFF,L.staff+ +d.staff));
  else if(d.theme){L.theme={key:d.theme,name:PRESETS[d.theme][0],color:PRESETS[d.theme][1]};delete sugg.__zones}
  else if(d.zoneidea){changed=addSpec("z-"+uid(),d.zoneidea,CUSTOM_COLORS[(L.specs.length+d.zoneidea.length)%CUSTOM_COLORS.length])}
  else if(d.suggestzones){suggestZones();return}
  else if(d.rmspec){L.specs=L.specs.filter(s=>s.key!==d.rmspec);delete sugg[d.rmspec]}
  else if(d.counter)L.counter=d.counter;
  else if(d.shelve){const b=L.books.find(x=>x.id===d.shelve);if(b&&b.read){b.shelved=true;b.shelvedAt=today();toast(`《${b.title}》上架！+${SHELF_REWARD} 金幣`)}}
  else if(d.rmbook){L.books=L.books.filter(b=>b.id!==d.rmbook)}
  else if(d.buy==="floor"){if(wallet(L)>=FLOOR_PRICE&&L.floors<MAX_FLOORS){L.floors++;view3d="out";toast("加蓋了一層樓！")}}
  else if(d.buy==="staff"){if(wallet(L)>=STAFF_PRICE&&L.staff<MAX_STAFF){L.staff++;toast("新館員報到！")}}
  else changed=false;
  if(changed){persist();render()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.zone){const b=L.books.find(x=>x.id===t.dataset.zone);if(b){b.spec=t.value;persist();toast(`已把《${b.title}》移到「${specOf(t.value)?.name||""}」`);render()}return}
  if(t.dataset.pick){const it=sugg[t.dataset.pick]?.items?.[+t.dataset.i];if(it)it.pick=t.checked}
  if(t.dataset.read){const b=L.books.find(x=>x.id===t.dataset.read);if(!b||b.shelved)return;b.read=t.checked;b.readAt=t.checked?today():"";persist();render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="customForm"){const v=$("#customSpec").value.trim();if(!v)return $("#customSpec").focus();
    const key="z-"+uid();
    if(addSpec(key,v,CUSTOM_COLORS[(L.specs.length+v.length)%CUSTOM_COLORS.length])){persist();render();if(sample)suggest(key)}}
  if(e.target.id==="themeForm"){const v=$("#themeIn").value.trim();if(!v)return $("#themeIn").focus();
    const pre=Object.entries(PRESETS).find(([,p])=>p[0]===v);
    L.theme=pre?{key:pre[0],name:v,color:pre[1][1]}:{key:"t-"+uid(),name:v,color:CUSTOM_COLORS[v.length%CUSTOM_COLORS.length]};delete sugg.__zones;persist();render();if(sample&&!L.specs.length)suggestZones()}
  if(e.target.id==="quickBook"){const v=$("#qbTitle").value.trim();if(!v)return $("#qbTitle").focus();L.books.push({id:uid(),title:v,author:"",spec:$("#qbZone").value,read:false,shelved:false});persist();render();toast("已加入館藏，讀完打勾就能上架")}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>mount3D());

/* ===== boot ===== */
render();
(async()=>{
  if(!window.claude?.use)return;
  const [d,u,sm]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")].map(p=>p.catch(()=>null)));
  user=u;sample=sm;if(u)me.id=await u.id();
  if(d&&me.id){db=d;
    db.doc("libraries/"+me.id).onSnapshot(s=>{if(s.exists&&screen==="intro"){L=migrate(structuredClone(s.data()));try{localStorage.setItem(LS,JSON.stringify(L))}catch(e){}render()}},()=>{});
    db.collection("libraries").onSnapshot(s=>{others={};s.docs.forEach(x=>{if(x.id!==me.id&&x.data().opened)others[x.id]=x.data()});if(screen==="intro")render()},()=>{});
  }
  render();
})();

</script>

</body></html>
